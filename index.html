<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iClimate — System Explorer</title>
<meta name="description" content="Interactive system explorer for the iClimate rice-farming decision support platform." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Mobile top bar -->
  <div class="mobile-bar">
    <button id="menuToggle" class="menu-toggle" aria-label="Open navigation">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-brand">iClimate <em>Explorer</em></span>
  </div>

  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="34" height="34">
            <path d="M24 4C24 4 10 20 10 30a14 14 0 0 0 28 0C38 20 24 4 24 4Z" fill="var(--color-accent-gold)" opacity="0.9"/>
            <path d="M24 14C24 14 16 24 16 30a8 8 0 0 0 16 0c0-6-8-16-8-16Z" fill="var(--color-bg-panel)"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">iClimate</div>
          <div class="brand-sub">System Explorer</div>
        </div>
      </div>

      <div class="sidebar-search">
        <input type="text" id="globalSearch" placeholder="Search modules, roles, tables…" autocomplete="off" />
      </div>

      <nav class="main-nav" id="mainNav" aria-label="Section navigation">
        <button class="nav-item active" data-section="overview">
          <span class="nav-index">01</span> Overview
        </button>
        <button class="nav-item" data-section="roles">
          <span class="nav-index">02</span> User Roles
        </button>
        <button class="nav-item" data-section="modules">
          <span class="nav-index">03</span> Core Modules
        </button>
        <button class="nav-item" data-section="architecture">
          <span class="nav-index">04</span> System Architecture
        </button>
        <button class="nav-item" data-section="database">
          <span class="nav-index">05</span> Database
        </button>
        <button class="nav-item" data-section="automation">
          <span class="nav-index">06</span> Automation
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="footer-loc">Lian, Batangas</div>
        <div class="footer-school">BatStateU ARASOF</div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- Main content -->
    <main class="content" id="content">

      <section class="panel active" id="section-overview" data-section-panel="overview"></section>
      <section class="panel" id="section-roles" data-section-panel="roles"></section>
      <section class="panel" id="section-modules" data-section-panel="modules"></section>
      <section class="panel" id="section-architecture" data-section-panel="architecture"></section>
      <section class="panel" id="section-database" data-section-panel="database"></section>
      <section class="panel" id="section-automation" data-section-panel="automation"></section>

    </main>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
